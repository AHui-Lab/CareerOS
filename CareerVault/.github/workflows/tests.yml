name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile
        run: python -m compileall careervault tests run.py
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Check browser JavaScript
        run: |
          node --check careervault/static/app.js
          node --check careervault/static/migration-review.js
