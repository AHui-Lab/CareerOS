<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CareerVault</title>
  <link rel="stylesheet" href="/static/styles.css" />
  <style>
    /* CareerVault 作为 CareerOS 的数据工作区嵌入时，不再显示第二套页面壳。 */
    .embedded-mode{background:#f4f3ee;color:#151512}
    .embedded-mode main{background:#f4f3ee}
    .embedded-mode main>.view>.topbar:first-child{display:none}
    .embedded-mode .experience-toolbar{justify-content:flex-end}
    .embedded-mode .experience-toolbar>.row{display:none}
    .embedded-mode .card{border-color:#deddd4;border-radius:15px;box-shadow:0 1px 2px rgba(20,20,18,.03)}
    .embedded-mode .btn{background:#171713;border:1px solid #171713;border-radius:10px;font-weight:700}
    .embedded-mode .btn.ghost,.embedded-mode .experience-tabs .btn.ghost{background:#fff;color:#151512;border-color:#deddd4}
    .embedded-mode .muted{color:#74736b}
    .embedded-mode .status,.embedded-mode .tag{background:#f1f0eb;color:#55544d}
    .embedded-mode .experience-search input{border-color:#deddd4;border-radius:11px}
  </style>
</head>
<body>
  <aside class="sidebar">
    <div class="brand">CareerVault <span>v0.2.1</span></div>
    <button data-view="experiences" class="nav active">经历项目</button>
    <button data-view="inbox" class="nav">草稿箱</button>
    <div class="sidebar-spacer"></div>
    <button id="gitSnapshot" class="secondary">创建 Git 快照</button>
    <div id="saveState" class="save-state">就绪</div>
  </aside>
  <main>
    <section id="dashboard" class="view"></section>
    <section id="experiences" class="view active"></section>
    <section id="profile" class="view"></section>
    <section id="settings" class="view"></section>
    <section id="files" class="view"></section>
    <section id="inbox" class="view"></section>
    <section id="integration" class="view"></section>
  </main>
  <div id="modal" class="modal hidden"><div class="modal-card" id="modalCard"></div></div>
  <script>if(new URLSearchParams(location.search).get('embedded')==='1')document.body.classList.add('embedded-mode');</script>
  <script src="/static/app.js?v=20260827-4"></script>
</body>
</html>
