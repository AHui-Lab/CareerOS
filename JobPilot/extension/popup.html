<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
body{font:14px/1.5 Inter,"Segoe UI","Microsoft YaHei",sans-serif;width:340px;margin:0;padding:16px;background:#f7f7f3;color:#171713}h1{font-size:18px;margin:0 0 4px}.muted{color:#77776f;font-size:12px}.card{margin-top:13px;background:#fff;border:1px solid #dfdfd7;border-radius:14px;padding:13px}.title{font-weight:700;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.url{font-size:11px;color:#77776f;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:4px}.actions{display:grid;gap:8px;margin-top:12px}button{width:100%;border:0;border-radius:11px;background:#171713;color:#fff;padding:11px;font-weight:700;cursor:pointer}button.secondary{background:#fff;color:#171713;border:1px solid #d8d8d0}button:disabled{opacity:.55}.status{margin-top:10px;font-size:12px;white-space:pre-wrap}.ok{color:#276749}.error{color:#a13d36}.warn{color:#8a641b}.divider{height:1px;background:#e7e6df;margin:13px 0}.hint{font-size:11px;color:#77776f;margin-top:8px}.review{display:grid;gap:7px;margin-top:12px}.review label,.version-label{display:grid;gap:3px;font-size:12px;font-weight:700}.review input,.review textarea,.version-label select{width:100%;box-sizing:border-box;border:1px solid #d8d8d0;border-radius:8px;padding:8px;font:inherit}.review textarea{resize:vertical;min-height:68px}.hidden{display:none}</style><link rel="stylesheet" href="workspace.css"></head><body>
<h1>CareerOS</h1><div class="muted">导入校招职位；生成岗位简历后，在网申页面辅助填写。</div>
<div class="card"><div id="pageTitle" class="title">正在读取页面…</div><div id="pageUrl" class="url"></div></div>
<div id="review" class="review hidden"><label>公司<input id="company" maxlength="120"></label><label>岗位<input id="role" maxlength="160"></label><label>地点<input id="location" maxlength="120"></label><label>截止时间<input id="deadline" maxlength="80"></label><label>岗位 JD 摘要<textarea id="jd" maxlength="60000"></textarea></label><div id="reviewWarning" class="hint"></div></div>
<div class="actions"><button id="fillBtn" disabled>智能填写当前页面</button><button id="undoBtn" class="secondary" disabled>撤销本次已填字段</button><button id="saveBtn" class="secondary" disabled>导入当前职位</button></div>
<label class="version-label" style="margin-top:12px">填表使用的简历版本<select id="resumeVersion"><option value="">仅基础资料，不使用岗位简历</option></select></label>
<label style="display:flex;gap:8px;align-items:flex-start;margin-top:10px;font-size:12px"><input id="overwriteFilled" type="checkbox" style="margin-top:3px"><span>覆盖页面里已经填写的内容</span></label>
<label style="display:flex;gap:8px;align-items:flex-start;margin-top:10px;font-size:12px"><input id="addRows" type="checkbox" style="margin-top:3px"><span>自动新增经历行<span class="muted">（新增行需手动删除）</span></span></label>
<label style="display:flex;gap:8px;align-items:flex-start;margin-top:12px;font-size:12px"><input id="allowSensitive" type="checkbox" style="margin-top:3px"><span>本次允许填写身份证、政治面貌、民族等敏感字段<br><span class="muted">仅本次有效，证件照文件仍需手动上传。</span></span></label>
<div id="status" class="status muted">请先启动 JobPilot。</div>
<details id="fillReport" class="hidden"><summary class="hint">查看本次填表明细</summary><div id="fillReportBody" class="status muted"></div></details>
<div class="divider"></div><div class="hint">智能填表不会点击“提交”，不会自动回答薪资、调剂、家庭、政治面貌、健康等需要本人判断的问题；文件上传仍需手动选择。</div>
<a class="popup-workspace-link" href="http://127.0.0.1:8765" target="_blank" rel="noopener">打开 CareerOS 工作台 ↗</a>
<script src="popup.js"></script></body></html>
